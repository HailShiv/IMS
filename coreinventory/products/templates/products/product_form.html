<!doctype html>
<html>
    <head>
        <title>
            {% if action == 'Edit' %}Edit{% else %}Add{% endif %} Product
        </title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h3>
                                {% if action == 'Edit' %}{{ product.name }}{%
                                else %}Add New Product{% endif %}
                            </h3>
                        </div>
                        <div class="card-body">
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label class="form-label">Name *</label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        name="name"
                                        value="{{ product.name|default:'' }}"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label"
                                        >SKU * (Unique)</label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        name="sku"
                                        value="{{ product.sku|default:'' }}"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label"
                                        >Unit Price *</label
                                    >
                                    <input
                                        type="number"
                                        step="0.01"
                                        class="form-control"
                                        name="unit_price"
                                        value="{{ product.unit_price|default:'0' }}"
                                        required
                                    />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Category</label>
                                    <select
                                        class="form-control"
                                        name="category"
                                    >
                                        <option value="">No Category</option>
                                        {% for cat in categories %}
                                        <option
                                            value="{{ cat.id }}"
                                            {%
                                            if
                                            product.category.id=""
                                            ="cat.id"
                                            %}selected{%
                                            endif
                                            %}
                                        >
                                            {{ cat.name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label"
                                        >Reorder Level</label
                                    >
                                    <input
                                        type="number"
                                        class="form-control"
                                        name="reorder_level"
                                        value="{{ product.reorder_level|default:0 }}"
                                    />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label"
                                        >Image URL (optional)</label
                                    >
                                    <input
                                        type="url"
                                        class="form-control"
                                        name="image"
                                        value="{{ product.image|default:'' }}"
                                    />
                                </div>
                                <div
                                    class="d-grid gap-2 d-md-flex justify-content-md-end"
                                >
                                    <a
                                        href="{% url 'products:product_list' %}"
                                        class="btn btn-secondary me-md-2"
                                        >Cancel</a
                                    >
                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                    >
                                        {% if action == 'Edit' %}Update{% else
                                        %}Create{% endif %} Product
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
