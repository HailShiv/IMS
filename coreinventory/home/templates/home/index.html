<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoreInventory IMS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 40px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1e293b;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<header>
    CoreInventory — Inventory Management System
</header>

<div class="container">
    <div class="card">
        <h1>Welcome 👋</h1>
        <p>Your Inventory System is running successfully.</p>
        <button class="btn">Go to Dashboard</button>
    </div>
</div>

</body>
</html>
